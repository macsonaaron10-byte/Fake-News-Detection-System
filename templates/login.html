<!DOCTYPE html>
<html>
<head>
    <title>Login - Fake News Detection</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;

            /* 🌈 SAME BACKGROUND AS MAIN APP */
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #1e3a8a 20%,
                #6366f1 45%,
                #a5b4fc 70%,
                #eef2ff 100%
            );

            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ✨ DOT PATTERN */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(
                rgba(255,255,255,0.08) 1px,
                transparent 1px
            );
            background-size: 22px 22px;
            pointer-events: none;
        }

        /* 🧊 LOGIN CARD */
        .login-box {
            width: 350px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #111827;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border: 1px solid #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .link {
            margin-top: 15px;
            font-size: 14px;
        }

        .link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>🔐 Login</h2>

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <div class="link">
        Don't have an account? <a href="/signup">Signup</a>
    </div>

</div>

</body>
</html>
